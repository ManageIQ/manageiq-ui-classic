approvedGitRepositories:
- "https://github.com/jquery-lts/jquery-security-patches.git**"

compressionLevel: mixed

enableGlobalCache: true

enableScripts: true

nodeLinker: node-modules

npmAuditExcludePackages:
  - bootstrap
  # patched | moderate | GHSA-q58r-hwc8-rm9j (CVE-2025-1647) | bootstrap =3.4.1          | 3.4.1 brought in by patternfly@npm:3.59.5
  # patched | moderate | GHSA-vxmc-5x29-h64v (CVE-2024-6485) | bootstrap >=1.4.0 <=3.4.1 | 3.4.1 brought in by patternfly@npm:3.59.5
  # Both are fixed by .yarn/patches/bootstrap-3.4.1.patch, but the audit still reports them because
  # the patched package keeps version 3.4.1.

yarnPath: .yarn/releases/yarn-4.18.1.cjs

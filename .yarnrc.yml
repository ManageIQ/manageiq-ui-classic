compressionLevel: mixed

enableGlobalCache: true

enableScripts: true

nodeLinker: node-modules

npmAuditExcludePackages:
  - bootstrap
  # patched | moderate | GHSA-q58r-hwc8-rm9j (CVE-2025-1647) | bootstrap =3.4.1          | 3.4.1 brought in by patternfly@npm:3.59.5
  # patched | moderate | GHSA-vxmc-5x29-h64v (CVE-2024-6485) | bootstrap >=1.4.0 <=3.4.1 | 3.4.1 brought in by patternfly@npm:3.59.5
  # Both are fixed by .yarn/patches/bootstrap-3.4.1.patch, but the audit still reports them because
  # the patched package keeps version 3.4.1.
  - picomatch
  # pending | high | GHSA-fc5q-39xc-vjpf | picomatch <=4.0.7 | 2.3.2 and 4.0.7 brought in by @parcel/watcher, micromatch, and others
  # picomatch is vulnerable to ReDoS through single-branch repeated extglobs. No patched version is available yet.
  - jquery
  # pending | moderate | GHSA-rmxg-73gg-4p98, GHSA-6c3j-c64m-qhgq, GHSA-jpcq-cgw6-v4j6, GHSA-gxr4-xjj5-5px2 | jquery <3.5.0 | jquery 2.2.4 (direct dependency)
  # The XSS advisories are not fixed by .yarn/patches/jquery-2.2.4.patch. Remove this exclusion when the app moves to jQuery 3.x.

yarnPath: .yarn/releases/yarn-4.18.1.cjs
